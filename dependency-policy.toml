schema-version = 1

[prestable.oxfmt]
version = "0.58.0"
owner = "Plan 130"
status = "Beta"
expiry = "first stable Oxfmt release"

[prestable.oxlint-tsgolint]
version = "0.24.0"
owner = "Plan 131"
status = "pre-stable"
expiry = "first stable oxlint-tsgolint release"
typescript-go-revision = "c080da62"

[handoff.plan-131]
oxlint = "1.73.0"
typescript = "7.0.2"
typescript-go-minimum = "TypeScript 7 GA revision or checked-in project/diagnostic parity proof"

[handoff.plan-129]
testing-library-user-event = "14.6.1"

[handoff.plan-132]
playwright-test = "1.61.1"
forbidden-direct = ["playwright", "playwright-core"]
runtime = "bun"
install = "explicit browser provisioning after ignore-scripts install"

[ui]
# Each entry is used outside a JavaScript/TypeScript import analyzed by Oxc:
# CSS imports/plugins, runtime peers, compiler types, config-discovered plugins,
# test-environment directives, or deliberately invoked maintainer tooling.
reviewed-non-ast = [
  "@fontsource-variable/geist-mono",
  "@fontsource-variable/inter",
  "@testing-library/dom",
  "@toolwind/corner-shape",
  "@types/react",
  "@types/react-dom",
  "jsdom",
  "prettier-plugin-tailwindcss",
  "react-dom",
  "shadcn",
  "tailwindcss",
  "tw-animate-css",
  "typescript",
]

[ui.blocked-lifecycle.unrs-resolver]
version = "1.12.2"
integrity = "sha512-dmlRxBJJayXjqTwC+JtF1HhJmgf3ftQ3YejFcZrf4+KKtJv0qDsK1pjqaaVjG7wJ5NJ6UVP1OqRMQ71Z4C3rxQ=="
script = "node postinstall.js"
disposition = "deny; optional binding is lock-provisioned and build-tested"
