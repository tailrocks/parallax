[tools]
rust = "1.97.0"
actionlint = "1.7.12"
cargo-binstall = "1.21.0"
"cargo:cargo-audit" = "0.22.2"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-fuzz" = "0.13.2"
"cargo:cargo-hack" = "0.6.45"
"cargo:cargo-shear" = "1.13.1"
cosign = "3.0.6"
gitleaks = "8.30.1"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.140"
"cargo:cargo-outdated" = "0.19.0"
"cargo:cargo-zigbuild" = "0.23.0"
bun = "1.3.14"
ripgrep = "15.1.0"
shellcheck = "0.11.0"
syft = "1.45.1"
zizmor = "1.26.1"
zig = "0.16.0"
"github:open-telemetry/weaver" = "0.24.2"

[settings]
lockfile = true
idiomatic_version_file_enable_tools = ["rust"]
cargo.binstall_only = true
cargo.binstall_quickinstall = true

[tasks.ci]
run = "cargo check --workspace --all-targets --locked"

[tasks.test]
run = "cargo nextest run --workspace --all-targets --profile ci --no-tests=fail --color=always"

[tasks.lint]
run = "rustup component add clippy && cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.fmt]
run = "cargo fmt --all -- --check"
