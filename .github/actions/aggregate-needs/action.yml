name: Aggregate gated job results
description: |
  Fail the calling job if any upstream listed in `needs:` failed or was
  cancelled. Skipped is success, so path-aware workflows keep one stable
  required check name.
inputs:
  needs-json:
    description: JSON-serialized needs context from the calling job.
    required: true
  workflow-label:
    description: Short workflow label for failure logs.
    required: true
runs:
  using: composite
  steps:
    - name: Aggregate gated job results
      shell: bash
      env:
        NEEDS_RESULT: ${{ inputs.needs-json }}
        WORKFLOW_LABEL: ${{ inputs.workflow-label }}
      run: |
        set -euo pipefail
        if ! scripts/ci/aggregate-results.sh "$NEEDS_RESULT" "$WORKFLOW_LABEL"; then
          echo "::error::one or more gated ${WORKFLOW_LABEL} jobs failed or were cancelled"
          exit 1
        fi
