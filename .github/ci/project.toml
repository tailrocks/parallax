watch = [".cargo/audit.toml", ".cargo/deny.toml", "Cargo.lock", "Cargo.toml", "audit.toml", "deny.toml"]
github_pr_commands = ["mbx deny check"]
github_full_commands = ["mbx deny check"]
velnor_pr_commands = ["mbx deny check"]
velnor_full_commands = ["mbx deny check"]
[unit.cache]
key_files = [".cargo/**", "Cargo.lock", "deny.toml"]
paths = ["~/.cargo/registry", "~/.cargo/git"]
