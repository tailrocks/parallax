name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  authorize-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require explicitly opened stable readiness
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_RELEASE_ENABLED: ${{ vars.STABLE_RELEASE_ENABLED }}
        run: |
          set -euo pipefail
          test "$STABLE_RELEASE_ENABLED" = "true" || {
            echo "::error::stable readiness is closed (STABLE_RELEASE_ENABLED != true)"
            exit 1
          }
          environment=$(
            gh api "repos/${GITHUB_REPOSITORY}/environments/stable-release"
          )
          jq -e '.protection_rules | any(.type == "required_reviewers")' \
            <<< "$environment" >/dev/null || {
              echo "::error::stable-release environment lacks required reviewers"
              exit 1
            }
          rulesets=$(gh api "repos/${GITHUB_REPOSITORY}/rulesets")
          authorized=false
          while IFS= read -r ruleset_id; do
            detail=$(gh api "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}")
            if jq -e '
              (.conditions.ref_name.include | index("refs/tags/v*")) != null and
              ([.rules[].type] | contains(["creation", "deletion", "non_fast_forward"]))
            ' <<< "$detail" >/dev/null; then
              authorized=true
              break
            fi
          done < <(jq -r '.[] | select(.target == "tag" and .enforcement == "active") | .id' <<< "$rulesets")
          test "$authorized" = true || {
            echo "::error::no active v* tag ruleset restricts create/update/delete"
            exit 1
          }

  check-version:
    needs: authorize-release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Determine version
        id: version
        run: |
          case "${GITHUB_REF}" in
            refs/tags/v*) ;;
            *)
              echo "::error::stable releases require an existing v* tag"
              exit 1
              ;;
          esac
          version="${GITHUB_REF#refs/tags/v}"
          workspace_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "$version" = "$workspace_version" || {
            echo "::error::tag version $version != workspace version $workspace_version"
            exit 1
          }
          case "$version" in
            *-dev*)
              echo "::error::stable releases cannot use a dev version ($version)"
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    needs: check-version
    uses: ./.github/workflows/ci.yml

  build:
    needs: [check-version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            zigbuild_target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
            zigbuild_target: x86_64-apple-darwin
          - target: aarch64-unknown-linux-gnu
            zigbuild_target: aarch64-unknown-linux-gnu.2.17
          - target: x86_64-unknown-linux-gnu
            zigbuild_target: x86_64-unknown-linux-gnu.2.17
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Cache Rust toolchain
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            rustup-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache Cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-${{ runner.arch }}-
      - id: sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        continue-on-error: true
        env:
          SCCACHE_GHA_ENABLED: "true"
      - name: Enable sccache
        if: steps.sccache.outcome == 'success'
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: Cache mise cargo tools
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.local/share/mise/installs/cargo-*
          key: mise-cargo-tools-${{ runner.os }}-${{ runner.arch }}-zigbuild-${{ hashFiles('mise.toml') }}
          restore-keys: |
            mise-cargo-tools-${{ runner.os }}-${{ runner.arch }}-zigbuild-
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install_args: "rust zig cargo:cargo-zigbuild cosign syft bun"
          github_token: ${{ secrets.GH_READONLY_TOKEN }}
      - name: Install Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: mise exec -- rustup target add "$TARGET"
      - name: Cache Cargo build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target
          key: cargo-target-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            cargo-target-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-release-${{ hashFiles('Cargo.lock') }}-
            cargo-target-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-release-
            cargo-target-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('Cargo.lock') }}-
            cargo-target-${{ runner.os }}-${{ runner.arch }}-release-
      - name: Set up verified macOS SDK
        if: contains(matrix.target, 'apple')
        uses: ./.github/actions/setup-macos-sdk
        with:
          version: "26.1"
          sha256: beee7212d265a6d2867d0236cc069314b38d5fb3486a6515734e76fa210c784c
      - name: Cache Bun modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: ui
      - run: bun run build
        working-directory: ui
      - name: Build
        env:
          ZIGBUILD_TARGET: ${{ matrix.zigbuild_target }}
          PARALLAX_VERSION_OVERRIDE: ${{ needs.check-version.outputs.version }}
        run: mise exec -- cargo zigbuild --release --locked -p parallax-cli --features embed-ui,cross-release-vendored --target "$ZIGBUILD_TARGET"
      - name: Package
        id: package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          archive="parallax-${VERSION}-${TARGET}.tar.gz"
          source_epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          mise exec -- cargo xtask release-package \
            --binary "target/${TARGET}/release/parallax" \
            --archive "$archive" \
            --target "$TARGET" \
            --version "$VERSION" \
            --channel stable \
            --source-epoch "$source_epoch"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "source_epoch=$source_epoch" >> "$GITHUB_OUTPUT"
      - name: Sign, SBOM, and attest archive
        uses: ./.github/actions/sign-and-attest-archive
        with:
          archive: ${{ steps.package.outputs.archive }}
      - name: Verify complete stable artifact set
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_EPOCH: ${{ steps.package.outputs.source_epoch }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          mise exec -- cargo xtask release-verify \
            --archive "$ARCHIVE" \
            --target "$TARGET" \
            --version "$VERSION" \
            --source-epoch "$SOURCE_EPOCH" \
            --source-commit "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --signer-identity "https://github.com/tailrocks/parallax/.github/workflows/release.yml@${GITHUB_REF}" \
            --signer-workflow tailrocks/parallax/.github/workflows/release.yml
      - name: Show sccache stats
        if: always() && steps.sccache.outcome == 'success'
        run: sccache --show-stats
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parallax-${{ matrix.target }}
          path: |
            parallax-*.tar.gz
            parallax-*.tar.gz.sha256
            parallax-*.tar.gz.bundle
            parallax-*.tar.gz.sbom.json

  publish:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: stable-release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          assets=(
            artifacts/parallax-*.tar.gz
            artifacts/parallax-*.tar.gz.sha256
            artifacts/parallax-*.tar.gz.bundle
            artifacts/parallax-*.tar.gz.sbom.json
          )
          gh release create "$tag" \
            --verify-tag \
            --title "Parallax ${VERSION}" \
            --notes "Parallax ${VERSION}" \
            "${assets[@]}"
