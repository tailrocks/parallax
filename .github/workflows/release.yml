name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      lanes:
        description: velnor (default) | github | both
        type: choice
        default: velnor
        options: [velnor, github, both]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  authorize-release:
    name: Authorize Release (${{ matrix.config.lane }})
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Require explicitly opened stable readiness
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_RELEASE_ENABLED: ${{ vars.STABLE_RELEASE_ENABLED }}
        run: |
          set -euo pipefail
          test "$STABLE_RELEASE_ENABLED" = "true" || {
            echo "::error::stable readiness is closed (STABLE_RELEASE_ENABLED != true)"
            exit 1
          }
          environment=$(
            gh api "repos/${GITHUB_REPOSITORY}/environments/stable-release"
          )
          jq -e '.protection_rules | any(.type == "required_reviewers")' \
            <<< "$environment" >/dev/null || {
              echo "::error::stable-release environment lacks required reviewers"
              exit 1
            }
          rulesets=$(gh api "repos/${GITHUB_REPOSITORY}/rulesets")
          authorized=false
          while IFS= read -r ruleset_id; do
            detail=$(gh api "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}")
            if jq -e '
              (.conditions.ref_name.include | index("refs/tags/v*")) != null and
              ([.rules[].type] | contains(["creation", "deletion", "non_fast_forward"]))
            ' <<< "$detail" >/dev/null; then
              authorized=true
              break
            fi
          done < <(jq -r '.[] | select(.target == "tag" and .enforcement == "active") | .id' <<< "$rulesets")
          test "$authorized" = true || {
            echo "::error::no active v* tag ruleset restricts create/update/delete"
            exit 1
          }

  check-version:
    needs: authorize-release
    name: Check Version (${{ matrix.config.lane }})
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Determine version
        id: version
        run: |
          case "${GITHUB_REF}" in
            refs/tags/v*) ;;
            *)
              echo "::error::stable releases require an existing v* tag"
              exit 1
              ;;
          esac
          version="${GITHUB_REF#refs/tags/v}"
          workspace_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "$version" = "$workspace_version" || {
            echo "::error::tag version $version != workspace version $workspace_version"
            exit 1
          }
          case "$version" in
            *-dev*)
              echo "::error::stable releases cannot use a dev version ($version)"
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate stable release identity
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: cargo xtask release-validate --version "$VERSION" --channel stable

  test:
    needs: check-version
    uses: ./.github/workflows/ci.yml
    with:
      force_all: true
      lanes: ${{ inputs.lanes || 'velnor' }}

  build:
    needs: [check-version, test]
    # Apple targets require macOS (dsymutil + codesign + Apple ld headerpad) so
    # release-package can embed real __DWARF line tables into the executable.
    # Linux targets stay on ubuntu with cargo-zigbuild (glibc 2.17 floor).
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_CACHE_SIZE: 20G
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            builder: cargo
          - target: x86_64-apple-darwin
            os: macos-latest
            builder: cargo
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-26.04
            builder: zigbuild
            zigbuild_target: aarch64-unknown-linux-gnu.2.17
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-26.04
            builder: zigbuild
            zigbuild_target: x86_64-unknown-linux-gnu.2.17
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # cache: Cargo owns registry downloads; sccache owns compiler outputs.
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: cargo-registry-${{ matrix.os }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ matrix.os }}-${{ runner.os }}-${{ runner.arch }}-
      - id: sccache
        uses: mozilla-actions/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e # v0.0.10
        with:
          version: v0.16.0
          disable_annotations: "false"
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install_args: ${{ matrix.builder == 'zigbuild' && 'rust zig cargo:cargo-zigbuild cosign syft bun' || 'rust cosign syft bun' }}
          github_token: ${{ secrets.GH_READONLY_TOKEN }}
      - name: Install Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: ui
      - run: bun run build
        working-directory: ui
      - name: Build (Apple native)
        if: matrix.builder == 'cargo'
        env:
          TARGET: ${{ matrix.target }}
          PARALLAX_VERSION_OVERRIDE: ${{ needs.check-version.outputs.version }}
        run: cargo build --release --locked -p parallax-cli --features embed-ui --target "$TARGET"
      - name: Build (Linux zigbuild)
        if: matrix.builder == 'zigbuild'
        env:
          ZIGBUILD_TARGET: ${{ matrix.zigbuild_target }}
          PARALLAX_VERSION_OVERRIDE: ${{ needs.check-version.outputs.version }}
        run: cargo zigbuild --release --locked -p parallax-cli --features embed-ui,cross-release-vendored --target "$ZIGBUILD_TARGET"
      - name: Package
        id: package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          archive="parallax-${VERSION}-${TARGET}.tar.gz"
          source_epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          cargo xtask release-package \
            --binary "target/${TARGET}/release/parallax" \
            --archive "$archive" \
            --target "$TARGET" \
            --version "$VERSION" \
            --channel stable \
            --source-epoch "$source_epoch"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "source_epoch=$source_epoch" >> "$GITHUB_OUTPUT"
      - name: Sign, SBOM, and attest archive
        uses: ./.github/actions/sign-and-attest-archive
        with:
          archive: ${{ steps.package.outputs.archive }}
      - name: Verify complete stable artifact set
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_EPOCH: ${{ steps.package.outputs.source_epoch }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          cargo xtask release-verify \
            --archive "$ARCHIVE" \
            --target "$TARGET" \
            --version "$VERSION" \
            --source-epoch "$SOURCE_EPOCH" \
            --source-commit "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --signer-identity "https://github.com/tailrocks/parallax/.github/workflows/release.yml@${GITHUB_REF}" \
            --signer-workflow tailrocks/parallax/.github/workflows/release.yml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parallax-${{ matrix.target }}
          path: |
            parallax-*.tar.gz
            parallax-*.tar.gz.sha256
            parallax-*.tar.gz.bundle
            parallax-*.tar.gz.sbom.json

  release:
    needs: [check-version, build]
    name: Publish (${{ matrix.config.lane }})
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
    environment: stable-release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        if: matrix.config.writer
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          assets=(
            artifacts/parallax-*.tar.gz
            artifacts/parallax-*.tar.gz.sha256
            artifacts/parallax-*.tar.gz.bundle
            artifacts/parallax-*.tar.gz.sbom.json
          )
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Parallax ${VERSION}" \
            --notes "Parallax ${VERSION}" \
            "${assets[@]}"
