  rust-parallax-bench-alloc:
    name: Rust / parallax-bench-alloc
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs:
      - plan
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
