  closure-final:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    # Documented exception (plan 107 audit B-3): GH_READONLY_TOKEN below is a
    # read-only token used solely by mise-action for tool-download rate limits.
    # It cannot write and cannot influence the verifier's verdict.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install_args: "rust bun actionlint"
          github_token: ${{ secrets.GH_READONLY_TOKEN }}
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install_args: "cargo:cargo-nextest cargo:cargo-audit cargo:cargo-deny cargo:cargo-hack cargo:cargo-shear"
          github_token: ${{ secrets.GH_READONLY_TOKEN }}
      - name: Verify closure fixtures or final commit
        run: |
          if test -f plans/107-program-closure-audits.md; then
            cargo xtask closure-final --dry-run
          else
            scripts/ci/closure-baseline.sh
            cargo xtask closure-final
          fi

  fuzz-bench:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Cache Cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-fuzz-${{ hashFiles('fuzz/Cargo.lock', 'Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache mise cargo tools
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.local/share/mise/installs/cargo-*
          key: mise-cargo-tools-${{ runner.os }}-${{ runner.arch }}-fuzz-${{ hashFiles('mise.toml') }}
          restore-keys: |
            mise-cargo-tools-${{ runner.os }}-${{ runner.arch }}-fuzz-
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install_args: "rust cargo:cargo-fuzz"
          github_token: ${{ secrets.GH_READONLY_TOKEN }}
      - run: rustup toolchain install nightly --profile minimal
      # Plan 103 Step 5 (PR lane): compile every fuzz target and smoke each
      # boundary briefly; long campaigns stay off PR CI. Benches must compile.
      - run: cargo +nightly fuzz build
      - name: Smoke fuzz targets
        run: |
          for target in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$target" -- -runs=2000 -max_total_time=30
          done
      - run: cargo check --locked --benches -p parallax-ingest -p parallax-spool -p parallax-greptime

