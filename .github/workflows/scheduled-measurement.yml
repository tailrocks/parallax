name: Scheduled Measurement

# Plan 103: scheduled fuzz campaigns + benchmark samples. After n≥3
# variance samples (2026-07-17), fail-closed ceilings live in
# docs/research/testing/bench-baselines.toml and are checked by
# scripts/ci/check-bench-baselines.sh — never auto-refreshed.

on:
  schedule:
    - cron: "17 3 * * *" # zizmor: ignore[cache-poisoning] measurement only, no publish authority
  workflow_dispatch:
    inputs:
      lanes:
        description: velnor (default) | github | both
        type: choice
        default: velnor
        options: [velnor, github, both]
permissions:
  contents: read

concurrency:
  group: scheduled-measurement
  cancel-in-progress: false

jobs:
  fuzz-campaign:
    name: Fuzz Campaign (${{ matrix.config.lane }})
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # cache: Cargo owns registry downloads; sccache owns compiler outputs.
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
          key: cargo-registry-${{ matrix.config.lane }}-${{ runner.os }}-${{ runner.arch }}-fuzz-${{ hashFiles('fuzz/Cargo.lock', 'Cargo.lock') }}
          restore-keys: cargo-registry-${{ matrix.config.lane }}-${{ runner.os }}-${{ runner.arch }}-
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install_args: "rust cargo:cargo-fuzz"
          github_token: ${{ secrets.GH_READONLY_TOKEN }}
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly fuzz build
      - name: Run five-minute campaigns per boundary
        run: |
          mkdir -p measurement/fuzz
          for target in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$target" -- -max_total_time=300 2>&1 | tail -20 \
              | tee "measurement/fuzz/${target}.log"
          done
      - name: Collect crash artifacts if any
        if: always()
        run: |
          if [ -d fuzz/artifacts ] && [ -n "$(find fuzz/artifacts -type f)" ]; then
            cp -r fuzz/artifacts measurement/fuzz/artifacts
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fuzz-campaign-${{ github.run_id }}
          path: measurement/fuzz
          retention-days: 30

  bench-samples:
    name: Bench Samples (${{ matrix.config.lane }})
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # cache: Cargo owns registry downloads; sccache owns compiler outputs.
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
          key: cargo-registry-${{ matrix.config.lane }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-${{ matrix.config.lane }}-${{ runner.os }}-${{ runner.arch }}-
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install_args: "rust"
          github_token: ${{ secrets.GH_READONLY_TOKEN }}
      - name: Run criterion benches (three repeats for variance)
        # Explicit bash gives pipefail so a cargo bench failure fails the step
        # even through tee (plan 107 audit B-2).
        shell: bash
        run: |
          mkdir -p measurement/bench
          for repeat in 1 2 3; do
            # A bench-run failure must fail this step directly, not surface
            # later as a MISSING baseline (plan 107 audit B-2).
            {
              cargo bench --locked -p parallax-ingest --bench normalize
              cargo bench --locked -p parallax-spool --bench spool_io
              cargo bench --locked -p parallax-greptime --bench arrow_decode
            } 2>&1 | tee "measurement/bench/full-${repeat}.log"
            grep -E "time:" "measurement/bench/full-${repeat}.log" \
              >> "measurement/bench/repeat-${repeat}.txt"
          done
      - name: Allocation profile (plan 103 zero-copy instrumentation)
        run: |
          (cd bench-alloc && cargo run --release) | tee measurement/bench/allocation-profile.txt
      - name: Fail-closed bench ratchets (no auto-refresh)
        run: |
          cat measurement/bench/repeat-*.txt > measurement/bench/all-repeats.txt
          scripts/ci/check-bench-baselines.sh \
            measurement/bench/all-repeats.txt \
            measurement/bench/allocation-profile.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bench-samples-${{ github.run_id }}
          path: measurement/bench
          retention-days: 90
