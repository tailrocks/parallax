name: Publish Homebrew Preview

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] gated to successful same-repository main pushes before checkout
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homebrew-parallax-publish
  cancel-in-progress: true

jobs:
  source-changed:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.filter.outputs.source }}
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve source SHA
        id: source
        env:
          DISPATCH_SHA: ${{ github.sha }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "sha=${DISPATCH_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${WORKFLOW_RUN_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "source=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sha="$SOURCE_SHA"
          old_sha=""
          formula_err=""
          if formula_body=$(curl -fsSL --max-time 30 "https://raw.githubusercontent.com/tailrocks/homebrew-parallax/main/Formula/parallax-preview.rb" 2>&1); then
            old_sha=$(printf '%s\n' "$formula_body" | sed -n 's|^[[:space:]]*# source-sha: \([0-9a-f]\{40\}\)$|\1|p' | head -1)
          else
            formula_err="$formula_body"
            echo "::warning::failed to fetch homebrew-parallax formula: ${formula_err}; falling open"
          fi

          if [ -n "$formula_err" ] || [ -z "$old_sha" ] || [ "$old_sha" = "$sha" ] \
             || ! git rev-parse --verify "${old_sha}^{commit}" >/dev/null 2>&1; then
            echo "source=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! { diff_files=$(git diff --name-only "${old_sha}...${sha}" 2>/tmp/diff.err); }; then
            diff_err=$(cat /tmp/diff.err)
            echo "::warning::diff failed for ${old_sha}...${sha}: ${diff_err}; falling open"
            echo "source=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          source=false
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              .github/workflows/preview.yml|Cargo.toml|Cargo.lock|rust-toolchain.toml|crates/**|ui/package.json|ui/bun.lock|ui/src/**|ui/vite.config.ts)
                source=true
                ;;
            esac
          done <<< "$diff_files"

          echo "source=$source" >> "$GITHUB_OUTPUT"

      - name: Compute preview metadata
        id: meta
        if: steps.filter.outputs.source == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FULL_SHA: ${{ steps.source.outputs.sha }}
        run: |
          base_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          base_version=${base_version%-dev}
          short_sha=$(printf '%s' "$FULL_SHA" | cut -c1-7)
          # Derive the preview counter from GitHub's server-side commit history
          # instead of local git counts.
          # shellcheck disable=SC2016
          graphql_query='query($owner: String!, $name: String!, $oid: GitObjectID!) { repository(owner: $owner, name: $name) { object(oid: $oid) { ... on Commit { history(first: 1) { totalCount } } } } }'
          commit_count=$(
            jq -cn \
              --arg query "$graphql_query" \
              --arg owner "$GITHUB_REPOSITORY_OWNER" \
              --arg name "${GITHUB_REPOSITORY#*/}" \
              --arg oid "$FULL_SHA" \
              '{query: $query, variables: {owner: $owner, name: $name, oid: $oid}}' |
              curl -fsSL \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Content-Type: application/json" \
                --data @- \
                https://api.github.com/graphql |
              jq -er '.data.repository.object.history.totalCount'
          )
          {
            echo "full_sha=$FULL_SHA"
            echo "version=${base_version}-preview.${commit_count}+${short_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate preview release identity
        if: steps.filter.outputs.source == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: cargo xtask release-validate --version "$VERSION" --channel preview

  build-preview:
    needs: source-changed
    if: needs.source-changed.outputs.source == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            zigbuild_target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
            zigbuild_target: x86_64-apple-darwin
          - target: aarch64-unknown-linux-gnu
            zigbuild_target: aarch64-unknown-linux-gnu.2.17
          - target: x86_64-unknown-linux-gnu
            zigbuild_target: x86_64-unknown-linux-gnu.2.17
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.source-changed.outputs.sha }}
          persist-credentials: false
      - name: Cache Rust toolchain
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            rustup-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache Cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-${{ runner.arch }}-
      - id: sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        continue-on-error: true
        env:
          SCCACHE_GHA_ENABLED: "true"
      - name: Enable sccache
        if: steps.sccache.outcome == 'success'
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: Cache mise cargo tools
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.local/share/mise/installs/cargo-*
          key: mise-cargo-tools-${{ runner.os }}-${{ runner.arch }}-zigbuild-${{ hashFiles('mise.toml') }}
          restore-keys: |
            mise-cargo-tools-${{ runner.os }}-${{ runner.arch }}-zigbuild-
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install_args: "rust zig cargo:cargo-zigbuild cosign syft bun"
          github_token: ${{ secrets.GH_READONLY_TOKEN }}
      - name: Install Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: mise exec -- rustup target add "$TARGET"
      - name: Cache Cargo build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target
          key: cargo-target-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-preview-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-preview-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            cargo-target-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-preview-release-${{ hashFiles('Cargo.lock') }}-
            cargo-target-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-preview-release-
            cargo-target-${{ runner.os }}-${{ runner.arch }}-preview-release-${{ hashFiles('Cargo.lock') }}-
            cargo-target-${{ runner.os }}-${{ runner.arch }}-preview-release-
      - name: Set up verified macOS SDK
        if: contains(matrix.target, 'apple')
        uses: ./.github/actions/setup-macos-sdk
        with:
          version: "26.1"
          sha256: beee7212d265a6d2867d0236cc069314b38d5fb3486a6515734e76fa210c784c
      - name: Cache Bun modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: ui
      - run: bun run build
        working-directory: ui
      - name: Build
        env:
          ZIGBUILD_TARGET: ${{ matrix.zigbuild_target }}
          PARALLAX_VERSION_OVERRIDE: ${{ needs.source-changed.outputs.version }}
        run: mise exec -- cargo zigbuild --release --locked -p parallax-cli --features embed-ui,cross-release-vendored --target "$ZIGBUILD_TARGET"
      - name: Package
        id: package
        env:
          TARGET: ${{ matrix.target }}
          SOURCE_SHA: ${{ needs.source-changed.outputs.sha }}
        run: |
          set -euo pipefail
          archive="parallax-${TARGET}.tar.gz"
          source_epoch=$(git show -s --format=%ct "$SOURCE_SHA")
          mise exec -- cargo xtask release-package \
            --binary "target/${TARGET}/release/parallax" \
            --archive "$archive" \
            --target "$TARGET" \
            --version "${{ needs.source-changed.outputs.version }}" \
            --channel preview \
            --source-epoch "$source_epoch"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "source_epoch=$source_epoch" >> "$GITHUB_OUTPUT"

      - name: Sign, SBOM, and attest archive
        uses: ./.github/actions/sign-and-attest-archive
        with:
          archive: ${{ steps.package.outputs.archive }}
      - name: Verify complete preview artifact set
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source-changed.outputs.sha }}
          SOURCE_EPOCH: ${{ steps.package.outputs.source_epoch }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.source-changed.outputs.version }}
        run: |
          mise exec -- cargo xtask release-verify \
            --archive "$ARCHIVE" \
            --target "$TARGET" \
            --version "$VERSION" \
            --source-epoch "$SOURCE_EPOCH" \
            --source-commit "$SOURCE_SHA" \
            --source-ref refs/heads/main \
            --signer-identity "https://github.com/tailrocks/parallax/.github/workflows/preview.yml@refs/heads/main" \
            --signer-workflow tailrocks/parallax/.github/workflows/preview.yml
      - name: Show sccache stats
        if: always() && steps.sccache.outcome == 'success'
        run: sccache --show-stats

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parallax-${{ matrix.target }}
          path: |
            parallax-${{ matrix.target }}.tar.gz
            parallax-${{ matrix.target }}.tar.gz.sha256
            parallax-${{ matrix.target }}.tar.gz.bundle
            parallax-${{ matrix.target }}.tar.gz.sbom.json

  publish-preview:
    needs: [source-changed, build-preview]
    if: needs.source-changed.outputs.source == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # rolling preview release assets only; the tap pulls independently
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish preview GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.source-changed.outputs.version }}
          SHA: ${{ needs.source-changed.outputs.sha }}
        run: |
          set -euo pipefail
          notes="Preview build from [${SHA:0:7}](https://github.com/${GITHUB_REPOSITORY}/commit/${SHA})."
          assets=(
            artifacts/parallax-*.tar.gz
            artifacts/parallax-*.tar.gz.sha256
            artifacts/parallax-*.tar.gz.bundle
            artifacts/parallax-*.tar.gz.sbom.json
          )

          if view_output=$(gh release view preview --json tagName 2>&1); then
            echo "preview release exists: $view_output"
            gh release edit preview \
              --prerelease \
              --target "$SHA" \
              --title "Preview ${VERSION}" \
              --notes "$notes"
            gh release upload preview "${assets[@]}" --clobber
            exit 0
          fi

          status=$?
          if echo "$view_output" | grep -qiE 'release not found|not found|release does not exist'; then
            gh release create preview \
              --prerelease \
              --target "$SHA" \
              --title "Preview ${VERSION}" \
              --notes "$notes" \
              "${assets[@]}"
          else
            echo "::error::gh release view failed: $view_output"
            exit "$status"
          fi
