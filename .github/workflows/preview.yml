name: Publish Homebrew Preview

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lanes:
        description: velnor (default) | github | both
        type: choice
        default: velnor
        options: [velnor, github, both]
permissions:
  contents: read

concurrency:
  # One publish in flight. Do not cancel a multi-target build when main
  # pushes queue another preview.
  group: homebrew-parallax-publish
  cancel-in-progress: false

jobs:
  source-changed:
    # Must match `on:` (push + workflow_dispatch). #23 switched the trigger
    # off workflow_run but left this if on workflow_run, so every main push
    # skipped and Homebrew preview froze at 69754e7 (2026-08-09).
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    name: Source Changed (${{ matrix.config.lane }})
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || ((github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') || github.event_name == 'push') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_CACHE_SIZE: 20G
    outputs:
      source: ${{ steps.filter.outputs.source }}
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve source SHA
        id: source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: echo "sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.source.outputs.sha }}
          # Full history is required to diff against the last published preview.
          fetch-depth: 0 # required by last-published-preview comparison

      - name: Classify changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "source=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sha="$SOURCE_SHA"
          old_sha=""
          formula_err=""
          if formula_body=$(curl -fsSL --max-time 30 "https://raw.githubusercontent.com/tailrocks/homebrew-parallax/main/Formula/parallax-preview.rb" 2>&1); then
            old_sha=$(printf '%s\n' "$formula_body" | sed -n 's|^[[:space:]]*# source-sha: \([0-9a-f]\{40\}\)$|\1|p' | head -1)
          else
            formula_err="$formula_body"
            echo "::warning::failed to fetch homebrew-parallax formula: ${formula_err}; falling open"
          fi

          if [ -n "$formula_err" ] || [ -z "$old_sha" ] || [ "$old_sha" = "$sha" ] \
             || ! git rev-parse --verify "${old_sha}^{commit}" >/dev/null 2>&1; then
            echo "source=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! { diff_files=$(git diff --name-only "${old_sha}...${sha}" 2>/tmp/diff.err); }; then
            diff_err=$(cat /tmp/diff.err)
            echo "::warning::diff failed for ${old_sha}...${sha}: ${diff_err}; falling open"
            echo "source=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          source=false
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              .github/workflows/preview.yml|Cargo.toml|Cargo.lock|rust-toolchain.toml|crates/**|ui/package.json|ui/bun.lock|ui/src/**|ui/vite.config.ts)
                source=true
                ;;
            esac
          done <<< "$diff_files"

          echo "source=$source" >> "$GITHUB_OUTPUT"

      - name: Compute preview metadata
        id: meta
        if: steps.filter.outputs.source == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FULL_SHA: ${{ steps.source.outputs.sha }}
        run: |
          base_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          base_version=${base_version%-dev}
          short_sha=$(printf '%s' "$FULL_SHA" | cut -c1-7)
          # Derive the preview counter from GitHub's server-side commit history
          # instead of local git counts.
          # shellcheck disable=SC2016
          graphql_query='query($owner: String!, $name: String!, $oid: GitObjectID!) { repository(owner: $owner, name: $name) { object(oid: $oid) { ... on Commit { history(first: 1) { totalCount } } } } }'
          commit_count=$(
            jq -cn \
              --arg query "$graphql_query" \
              --arg owner "$GITHUB_REPOSITORY_OWNER" \
              --arg name "${GITHUB_REPOSITORY#*/}" \
              --arg oid "$FULL_SHA" \
              '{query: $query, variables: {owner: $owner, name: $name, oid: $oid}}' |
              curl -fsSL \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Content-Type: application/json" \
                --data @- \
                https://api.github.com/graphql |
              jq -er '.data.repository.object.history.totalCount'
          )
          {
            echo "full_sha=$FULL_SHA"
            echo "version=${base_version}-preview.${commit_count}+${short_sha}"
          } >> "$GITHUB_OUTPUT"

      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        if: steps.filter.outputs.source == 'true'
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        if: steps.filter.outputs.source == 'true'
        with:
          version: v0.16.0
          disable_annotations: "false"
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        if: steps.filter.outputs.source == 'true'
        with:
          install_args: rust
          github_token: ${{ secrets.GH_READONLY_TOKEN }}
      - name: Cache Cargo target
        if: steps.filter.outputs.source == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: cargo-target-${{ matrix.config.lane }}-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', '**/Cargo.toml', '**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: cargo-target-${{ matrix.config.lane }}-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', '**/Cargo.toml', '**/Cargo.lock') }}-

      - name: Validate preview release identity
        if: steps.filter.outputs.source == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: cargo xtask release-validate --version "$VERSION" --channel preview

  build-preview:
    needs: source-changed
    if: needs.source-changed.outputs.source == 'true'
    # Apple targets require macOS (dsymutil + codesign + Apple ld headerpad) so
    # release-package can embed real __DWARF line tables into the executable.
    # Linux targets stay on ubuntu with cargo-zigbuild (glibc 2.17 floor).
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_CACHE_SIZE: 20G
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            builder: cargo
          - target: x86_64-apple-darwin
            os: macos-latest
            builder: cargo
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-26.04
            builder: zigbuild
            zigbuild_target: aarch64-unknown-linux-gnu.2.17
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-26.04
            builder: zigbuild
            zigbuild_target: x86_64-unknown-linux-gnu.2.17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.source-changed.outputs.sha }}
      # cache: Cargo owns registry downloads; sccache owns compiler outputs.
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: cargo-registry-${{ matrix.os }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ matrix.os }}-${{ runner.os }}-${{ runner.arch }}-
      - id: sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.16.0
          disable_annotations: "false"
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install_args: ${{ matrix.builder == 'zigbuild' && 'rust zig cargo-binstall cargo:cargo-zigbuild cosign syft bun' || 'rust cosign syft bun' }}
          github_token: ${{ secrets.GH_READONLY_TOKEN }}
      - name: Install Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: ui
      - run: bun run build
        working-directory: ui
      - name: Build (Apple native)
        if: matrix.builder == 'cargo'
        env:
          TARGET: ${{ matrix.target }}
          PARALLAX_VERSION_OVERRIDE: ${{ needs.source-changed.outputs.version }}
        run: cargo build --release --locked -p parallax-cli --features embed-ui --target "$TARGET"
      - name: Build (Linux zigbuild)
        if: matrix.builder == 'zigbuild'
        env:
          ZIGBUILD_TARGET: ${{ matrix.zigbuild_target }}
          PARALLAX_VERSION_OVERRIDE: ${{ needs.source-changed.outputs.version }}
        run: cargo zigbuild --release --locked -p parallax-cli --features embed-ui,cross-release-vendored --target "$ZIGBUILD_TARGET"
      - name: Package
        id: package
        env:
          TARGET: ${{ matrix.target }}
          SOURCE_SHA: ${{ needs.source-changed.outputs.sha }}
        run: |
          set -euo pipefail
          archive="parallax-${TARGET}.tar.gz"
          source_epoch=$(git show -s --format=%ct "$SOURCE_SHA")
          cargo xtask release-package \
            --binary "target/${TARGET}/release/parallax" \
            --archive "$archive" \
            --target "$TARGET" \
            --version "${{ needs.source-changed.outputs.version }}" \
            --channel preview \
            --source-epoch "$source_epoch"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "source_epoch=$source_epoch" >> "$GITHUB_OUTPUT"

      - name: Sign, SBOM, and attest archive
        uses: ./.github/actions/sign-and-attest-archive
        with:
          archive: ${{ steps.package.outputs.archive }}
      - name: Verify complete preview artifact set
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source-changed.outputs.sha }}
          SOURCE_EPOCH: ${{ steps.package.outputs.source_epoch }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.source-changed.outputs.version }}
        run: |
          cargo xtask release-verify \
            --archive "$ARCHIVE" \
            --target "$TARGET" \
            --version "$VERSION" \
            --source-epoch "$SOURCE_EPOCH" \
            --source-commit "$SOURCE_SHA" \
            --source-ref refs/heads/main \
            --signer-identity "https://github.com/tailrocks/parallax/.github/workflows/preview.yml@refs/heads/main" \
            --signer-workflow tailrocks/parallax/.github/workflows/preview.yml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parallax-${{ matrix.target }}
          path: |
            parallax-${{ matrix.target }}.tar.gz
            parallax-${{ matrix.target }}.tar.gz.sha256
            parallax-${{ matrix.target }}.tar.gz.bundle
            parallax-${{ matrix.target }}.tar.gz.sbom.json

  publish-preview:
    needs: [source-changed, build-preview]
    if: needs.source-changed.outputs.source == 'true'
    name: Publish Preview (${{ matrix.config.lane }})
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || ((github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') || github.event_name == 'push') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 20
    permissions:
      contents: write # rolling preview release assets only; the tap pulls independently
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          path: artifacts
          pattern: parallax-*
          merge-multiple: true

      - name: Publish preview GitHub Release
        if: matrix.config.writer
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.source-changed.outputs.version }}
          SHA: ${{ needs.source-changed.outputs.sha }}
        run: |
          set -euo pipefail
          notes="Preview build from [${SHA:0:7}](https://github.com/${GITHUB_REPOSITORY}/commit/${SHA})."
          assets=(
            artifacts/parallax-*.tar.gz
            artifacts/parallax-*.tar.gz.sha256
            artifacts/parallax-*.tar.gz.bundle
            artifacts/parallax-*.tar.gz.sbom.json
          )

          if view_output=$(gh release view preview --repo "$GITHUB_REPOSITORY" --json tagName 2>&1); then
            echo "preview release exists: $view_output"
            gh release edit preview \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --target "$SHA" \
              --title "Preview ${VERSION}" \
              --notes "$notes"
            gh release upload preview --repo "$GITHUB_REPOSITORY" "${assets[@]}" --clobber
          else
            status=$?
            if echo "$view_output" | grep -qiE 'release not found|not found|release does not exist'; then
              gh release create preview \
                --repo "$GITHUB_REPOSITORY" \
                --prerelease \
                --target "$SHA" \
                --title "Preview ${VERSION}" \
                --notes "$notes" \
                "${assets[@]}"
            else
              echo "::error::gh release view failed: $view_output"
              exit "$status"
            fi
          fi
