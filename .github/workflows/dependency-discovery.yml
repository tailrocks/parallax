name: Dependency Discovery

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-discovery
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install_args: "rust bun cargo:cargo-outdated"
          github_token: ${{ secrets.GH_READONLY_TOKEN }}
      - name: Record Rust latest-stable discovery
        run: cargo outdated --workspace --format json > cargo-outdated.json
      - name: Record Bun latest-stable discovery
        working-directory: ui
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun outdated > ../bun-outdated.txt
      - name: Record report-only third-party declaration failures
        working-directory: ui
        run: |
          set +e
          bunx --bun --no-install tsc --noEmit --skipLibCheck false > ../skip-lib-check.txt 2>&1
          status=$?
          set -e
          echo "exit-status=$status" >> ../skip-lib-check.txt
      - name: Upload dependency discovery
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-discovery
          path: |
            cargo-outdated.json
            bun-outdated.txt
            skip-lib-check.txt
          if-no-files-found: error
