name: Dependency Discovery

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      lanes:
        description: velnor (default) | github | both
        type: choice
        default: velnor
        options: [velnor, github, both]
permissions:
  contents: read

concurrency:
  group: dependency-discovery
  cancel-in-progress: true

jobs:
  report:
    name: Report (${{ matrix.config.lane }})
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install_args: "rust bun cargo:cargo-outdated"
          github_token: ${{ secrets.GH_READONLY_TOKEN }}
      - name: Record Rust latest-stable discovery
        run: cargo outdated --workspace --format json > cargo-outdated.json
      - name: Record Bun latest-stable discovery
        working-directory: ui
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun outdated > ../bun-outdated.txt
      - name: Record report-only third-party declaration failures
        working-directory: ui
        run: |
          set +e
          bunx --bun --no-install tsc --noEmit --skipLibCheck false > ../skip-lib-check.txt 2>&1
          status=$?
          set -e
          echo "exit-status=$status" >> ../skip-lib-check.txt
      - name: Upload dependency discovery
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-discovery
          path: |
            cargo-outdated.json
            bun-outdated.txt
            skip-lib-check.txt
          if-no-files-found: error
