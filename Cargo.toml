[workspace]
resolver = "3"
members = [
    "crates/parallax-cli",
    "crates/parallax-core",
    "crates/parallax-model",
    "crates/parallax-api",
    "crates/parallax-proto",
    "crates/parallax-server",
    "crates/parallax-storage",
    "crates/parallax-test-support",
    "crates/parallax-mcp-spike",
    "crates/parallax-xtask",
]
exclude = ["poc/evidence-loop", "poc/read-transport-bench"]

[profile.release]
# Shipped binaries retain source-line tables for panic/backtrace fidelity.
# Plan 102 verifies these final archive bytes; no symbol companion is required.
debug = "line-tables-only"
strip = "none"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.97.0"
license = "Apache-2.0"
authors = ["Tailrocks"]
repository = "https://github.com/tailrocks/parallax"

[workspace.dependencies]
parallax-api = { path = "crates/parallax-api" }
parallax-core = { path = "crates/parallax-core" }
parallax-model = { path = "crates/parallax-model" }
parallax-proto = { path = "crates/parallax-proto" }
parallax-server = { path = "crates/parallax-server" }
parallax-storage = { path = "crates/parallax-storage" }
parallax-test-support = { path = "crates/parallax-test-support" }

anyhow = "1"
arrow = { version = "59", default-features = false, features = ["ipc"] }
arrow-ipc = { version = "59", default-features = false, features = ["zstd"] }
async-trait = "0.1"
bytes = "1"
jsonschema = { version = "0.47", default-features = false }
juniper = "0.17"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
cargo_metadata = "0.23"
oxc_allocator = "0.139.0"
oxc_ast = "0.139.0"
oxc_parser = "0.139.0"
oxc_semantic = "0.139.0"
oxc_span = "0.139.0"
oxc_resolver = "11.24.2"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
rustc_lexer = { package = "ra-ap-rustc_lexer", version = "0.174.0" }
syn = { version = "2", features = ["full", "visit"] }
prost = "0.14"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "stream", "form"] }
rust-embed = "8"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
urlencoding = "2"
futures-core = "0.3"
futures-util = "0.3"
toml = "1"
time = { version = "0.3.48", features = ["parsing", "macros"] }
tonic = { version = "0.14", features = ["gzip"] }
turso = "0.6"
tower-http = { version = "0.7", features = ["fs", "decompression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
rust_2024_compatibility = { level = "warn", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
unused = { level = "warn", priority = -1 }
unsafe_code = "forbid"
dead_code = "warn"
let_underscore_drop = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_debug_implementations = "warn"
missing_unsafe_on_extern = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
unnameable_types = "warn"
unreachable_code = "warn"
unreachable_pub = "warn"
unfulfilled_lint_expectations = "warn"
unit_bindings = "warn"
unsafe_attr_outside_unsafe = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_imports = "warn"
unused_lifetimes = "warn"
unused_must_use = "warn"
unused_qualifications = "warn"
unused_variables = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "warn"
invalid_codeblock_attributes = "warn"
invalid_html_tags = "warn"
private_intra_doc_links = "warn"
redundant_explicit_links = "warn"
unescaped_backticks = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
assertions_on_result_states = "warn"
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
dbg_macro = "warn"
disallowed_methods = "warn"
expect_used = "warn"
expl_impl_clone_on_copy = "warn"
float_cmp = "warn"
float_cmp_const = "warn"
infallible_try_from = "warn"
invalid_upcast_comparisons = "warn"
iter_not_returning_iterator = "warn"
let_underscore_future = "warn"
let_underscore_must_use = "warn"
lossy_float_literal = "warn"
manual_assert = "warn"
mem_forget = "warn"
mod_module_files = "warn"
multiple_unsafe_ops_per_block = "warn"
panic = "warn"
rc_mutex = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unwrap_used = "warn"
unused_result_ok = "warn"
wildcard_dependencies = "warn"

# Measured pedantic exclusions: these do not encode Plan 096 correctness,
# ownership, numeric, async, or structural policy. Typed error documentation
# is owned by Plan 099; the remainder are style preferences with no product
# invariant. Keep this list explicit rather than weakening `pedantic`.
missing_errors_doc = "allow"
map_unwrap_or = "allow"
format_push_string = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
redundant_closure_for_method_calls = "allow"
default_trait_access = "allow"
needless_raw_string_hashes = "allow"
case_sensitive_file_extension_comparisons = "allow"
needless_pass_by_value = "allow"
match_same_arms = "allow"
format_collect = "allow"
items_after_statements = "allow"
wildcard_imports = "allow"
unused_async = "allow"
unnecessary_wraps = "allow"
uninlined_format_args = "allow"
single_match_else = "allow"
return_self_not_must_use = "allow"
ref_option = "allow"
option_option = "allow"
naive_bytecount = "allow"
match_wildcard_for_single_variants = "allow"
implicit_clone = "allow"
explicit_iter_loop = "allow"
duration_suboptimal_units = "allow"
unreadable_literal = "allow"
similar_names = "allow"
