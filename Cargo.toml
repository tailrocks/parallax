[workspace]
resolver = "3"
members = [
    "crates/parallax-cli",
    "crates/parallax-core",
    "crates/parallax-api",
    "crates/parallax-proto",
    "crates/parallax-server",
    "crates/parallax-storage",
    "crates/parallax-mcp-spike",
    "crates/parallax-xtask",
]
exclude = ["poc/evidence-loop", "poc/read-transport-bench"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.97.0"
license = "Apache-2.0"
authors = ["Tailrocks"]
repository = "https://github.com/tailrocks/parallax"

[workspace.dependencies]
parallax-api = { path = "crates/parallax-api" }
parallax-core = { path = "crates/parallax-core" }
parallax-proto = { path = "crates/parallax-proto" }
parallax-server = { path = "crates/parallax-server" }
parallax-storage = { path = "crates/parallax-storage" }

anyhow = "1"
arrow = { version = "59", default-features = false, features = ["ipc"] }
arrow-ipc = { version = "59", default-features = false, features = ["zstd"] }
async-trait = "0.1"
bytes = "1"
jsonschema = { version = "0.47", default-features = false }
juniper = "0.17"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
cargo_metadata = "0.23"
oxc_allocator = "0.139.0"
oxc_ast = "0.139.0"
oxc_parser = "0.139.0"
oxc_semantic = "0.139.0"
oxc_span = "0.139.0"
oxc_resolver = "11.24.2"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
rustc_lexer = { package = "ra-ap-rustc_lexer", version = "0.174.0" }
syn = { version = "2", features = ["full", "visit"] }
prost = "0.14"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls-vendored", "stream", "form"] }
rust-embed = "8"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
urlencoding = "2"
futures-core = "0.3"
futures-util = "0.3"
toml = "1"
time = { version = "0.3.48", features = ["parsing", "macros"] }
tonic = { version = "0.14", features = ["gzip"] }
turso = "0.6"
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "decompression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.clippy]
unwrap_used = "warn"
