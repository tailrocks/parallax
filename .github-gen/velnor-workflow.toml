schema = 1

[generator]
repository = "tailrocks/parallax"
revision = "048a7bdaed8240cf652127c94434e60528633dec"

[scan]
exclude = [
  "crates/parallax-xtask/src/release/tests.rs",
  "scripts/fixtures/nextest-evidence/**",
  "crates/parallax-sentry-proxy/Dockerfile",
]

[workflow]
runners = "github"
automatic_lanes = "github"
default_dispatch_runner = "github"
github_runner = "ubuntu-26.04"
velnor_labels = ["self-hosted", "velnor-target-mvp"]
default_branch = "main"
pull_request_on_velnor = false

[policy]
ruleset_external_status_checks = ["DCO"]
ruleset_required_status_checks = ["ci-required"]
ci_required = true
dco_required = true
actionlint_config_variables_null = true

[[units]]
id = "bun-ui"
# Package scripts can read configs and assets beyond a fixed extension list.
watch = ["ui/**"]

[[units.products]]
name = "embedded-ui"
task = "build-ui-for-rust"

[[units]]
id = "rust-parallax-server"
mise_tools = ["bun"]

[units.env]
# GitHub-hosted /tmp is quota-capped; mbx cache import unpacks via tempfile
# into TMPDIR. Job-level ${{ runner.temp }} is Policy-forbidden (runner
# context). ubuntu-26.04 github-hosted RUNNER_TEMP is this path.
TMPDIR = "/home/runner/work/_temp"
TMP = "/home/runner/work/_temp"
# 048 pins mr-boxington-action v1.3.0, which auto-GCs on hosted runners.
# A 12GiB budget is below embed-ui server/cli stores (~27GiB), so GC evicts
# action results and post-step export fails. Disable the sweep; do not bump
# to e94/v1.3.1.
MBX_GC_AUTO = "0"

[[units.prerequisites]]
producer = "bun-ui"
product = "embedded-ui"

[[units]]
id = "rust-parallax-cli"
mise_tools = ["bun"]

[units.env]
TMPDIR = "/home/runner/work/_temp"
TMP = "/home/runner/work/_temp"
MBX_GC_AUTO = "0"

[[units.prerequisites]]
producer = "bun-ui"
product = "embedded-ui"
