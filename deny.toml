[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
]
all-features = false

[advisories]
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.93

[[licenses.clarify]]
crate = "cfg_block@0.1.1"
expression = "Apache-2.0"
license-files = [{ path = "LICENSE", hash = 0xc9663a1e }]

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "simplest-path"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = true
deny = [
  { crate = "hyper-rustls", reason = "Parallax requires operating-system native TLS" },
  { crate = "rustls", reason = "Parallax requires operating-system native TLS" },
  { crate = "rustls-native-certs", reason = "Parallax requires operating-system native TLS" },
  { crate = "rustls-pemfile", reason = "Parallax requires operating-system native TLS" },
  { crate = "tokio-rustls", reason = "Parallax requires operating-system native TLS" },
  { crate = "webpki-roots", reason = "Parallax requires operating-system native TLS" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
