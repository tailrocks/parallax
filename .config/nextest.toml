[store]
dir = "target/nextest"

[test-groups]
greptime-engine = { max-threads = 1 }

[profile.default]
retries = 0
flaky-result = "fail"
fail-fast = true
slow-timeout = { period = "60s", terminate-after = 1, on-timeout = "fail" }
global-timeout = "20m"
status-level = "pass"
final-status-level = "flaky"

[profile.local]
retries = 0
flaky-result = "fail"

[profile.local.junit]
path = "junit.xml"
report-name = "parallax-nextest-local"
store-success-output = false
store-failure-output = true

[profile.ci]
retries = { backoff = "fixed", count = 2, delay = "1s" }
flaky-result = "fail"
fail-fast = false
global-timeout = "20m"
slow-timeout = { period = "60s", terminate-after = 1, on-timeout = "fail" }

[profile.ci.junit]
path = "junit.xml"
report-name = "parallax-nextest-ci"
store-success-output = false
store-failure-output = true

[profile.real-engine]
retries = 0
flaky-result = "fail"
fail-fast = false
global-timeout = "45m"
slow-timeout = { period = "10m", terminate-after = 1, on-timeout = "fail" }

[profile.real-engine.junit]
path = "junit.xml"
report-name = "parallax-nextest-real-engine"
store-success-output = false
store-failure-output = true

[[profile.default.overrides]]
# Every live Greptime integration binary shares the managed port and data root.
# Match the binary family so adding a scenario cannot silently escape serialization.
filter = 'binary_id(/::m[0-9]+_.*greptime$/) | binary_id(/::m5_gates$/) | binary_id(/::upgrade_preview$/)'
test-group = "greptime-engine"
slow-timeout = { period = "15m", terminate-after = 1, on-timeout = "fail" }
