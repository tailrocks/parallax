[package]
name = "parallax-server"
description = "Parallax server: OTLP ingest, workers, API host, engine supervision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
parallax-analysis = { workspace = true }
anyhow = { workspace = true }
juniper = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
parallax-api = { workspace = true }
parallax-greptime = { workspace = true }
parallax-ingest = { workspace = true }
parallax-metadata = { workspace = true }
parallax-proto = { workspace = true }
parallax-spool = { workspace = true }
parallax-storage = { workspace = true }
prost = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tokio-stream = { workspace = true }
futures-core = { workspace = true }
tonic = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Self-telemetry: `parallax serve` exports its own spans/logs over OTLP to a
# configured collector (e.g. the lab's Rotel) — opt-in via `PARALLAX_SELF_OTLP`
# / `[telemetry] self_otlp_endpoint`. The ingest-path is suppressed so the sink
# does not re-export what it just received (self→Rotel→self loop).
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "logs", "trace", "metrics"] }
opentelemetry_sdk = "0.32"
opentelemetry-appender-tracing = "0.32"
tracing-opentelemetry = "0.33"
rust-embed = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }

[features]
# Compile the built web UI (ui/dist/client) into the binary for single-file
# distribution. Requires `bun run build` in ui/ first; scripts/release.sh does.
embed-ui = ["dep:rust-embed", "dep:mime_guess"]
cross-release-vendored = [
    "reqwest/native-tls-vendored",
    "parallax-greptime/cross-release-vendored",
]

[dev-dependencies]
flate2 = "1"
reqwest = { workspace = true }
tempfile = "3"
parallax-test-support = { workspace = true }
