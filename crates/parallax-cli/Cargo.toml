[package]
name = "parallax-cli"
description = "Parallax: local-first observability for agent-assisted development"
version.workspace = true
build = "build.rs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.cargo-shear]
ignored-paths = ["src/commands/tests.rs"]

[[bin]]
name = "parallax"
path = "src/main.rs"

[features]
# Single-binary release: serve the web UI from assets compiled in at build
# time (scripts/release.sh builds ui/ first, then enables this).
embed-ui = ["parallax-server/embed-ui"]
cross-release-vendored = [
    "reqwest/native-tls-vendored",
    "parallax-server/cross-release-vendored",
]

[dependencies]
parallax-semconv = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
parallax-server = { workspace = true }
parallax-model = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
urlencoding = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
