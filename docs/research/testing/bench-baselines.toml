# Plan 103 fail-closed performance ceilings (ubuntu-latest scheduled samples).
# NEVER auto-refresh these values in CI. Only a human commit may raise a ceiling
# after a measured regression investigation. Lowering is always safe.
#
# Sampled from three independent scheduled-measurement jobs on 2026-07-17:
#   29582532812, 29589577179, 29592948190
# Units for timing ceilings are microseconds (µs). Allocation is absolute.

schema_version = 1
runner = "ubuntu-latest"
no_auto_refresh = true

# Absolute: identical 7011 allocations/call across all three jobs.
[allocation]
name = "normalize_metrics_1k_points"
max_allocations_per_call = 7011
max_bytes_per_call = 1_022_357

# Timing ceilings ≈ max observed mid × ~1.35 headroom (spool_line_count excluded).
[[bench]]
name = "normalize_metrics_1k_points"
ceiling_us = 410.0

[[bench]]
name = "spool_append_4k"
ceiling_us = 55.0

[[bench]]
name = "arrow_decode_10k_rows"
ceiling_us = 2600.0

[[bench]]
name = "arrow_decode_10k_rows_zstd"
ceiling_us = 3000.0

# spool_line_count_1k (the fixed-size replacement for the noisy growing-file
# measurement) gains its ceiling after three scheduled jobs measure it;
# absent benches are reported MISSING (fail) only once listed here.
