query IssueDetail(
  $service: String!
  $fingerprint: String!
  $fromNanos: String!
  $toNanos: String!
  $hours: Int!
) {
  issue(service: $service, fingerprint: $fingerprint) {
    fingerprint
    title
    errorType
    culprit
    service
    status
    firstSeenNanos
    lastSeenNanos
    eventCount
    lastTraceId
    tags
    environmentCounts {
      environment
      count
    }
    groupingExplanation {
      algorithmVersion
      errorType
      messageTemplate
      anchorFrame
      operation
      inputsPresent
    }
    events(limit: 20, fromNanos: $fromNanos, toNanos: $toNanos) {
      tsNanos
      service
      message
      stacktrace
      source
      traceId
      spanId
      environment
      attributes
    }
  }
  issueTrend(service: $service, fingerprint: $fingerprint, hours: $hours) {
    tsNanos
    count
  }
}
