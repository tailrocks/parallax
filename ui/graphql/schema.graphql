schema {
  query: Query
  mutation: Mutation
}

"How `issues` lists are ordered. TREND = last-24h occurrence sum."
enum IssueSort {
  LAST_SEEN
  FIRST_SEEN
  EVENTS
  TREND
}

enum SignalKind {
  SPANS
  TRACES
  LOGS
  ERRORS
  METRIC_POINTS
}

enum TestExplorerSort {
  LAST_SEEN
  NAME
}

enum TestFlakyState {
  HEALTHY
  FLAKY
  FIXED
  BROKEN
}

enum TestIdentitySource {
  EXPLICIT
  CODE_REFERENCE
  NAME_PATH
}

enum TestResultStatus {
  PASSED
  FAILED
  BROKEN
  SKIPPED
  UNKNOWN
}

enum TestRollup {
  PASSED
  FLAKY_PASS
  FAILED
  BROKEN
  SKIPPED
  UNKNOWN
}

enum TraceSort {
  START_DESC
  DURATION_DESC
  DURATION_ASC
  SPAN_COUNT_DESC
}

"""
  Create/update payload for an alert rule. Optional knobs fall back to the
  plan-167 defaults (2 consecutive breaches/healthy, `skip` on no data,
  30-minute renotify, minimum sample count 1).
"""
input AlertRuleInput {
  id: String
  name: String!
  enabled: Boolean
  signalType: String!
  services: [String!]
  excludeServices: [String!]
  "JSON array of attribute filters (`{key, op, value}`), stored opaquely." attributeFilters: String
  groupBy: String
  comparator: String!
  threshold: Float!
  thresholdUpper: Float
  windowMinutes: Int!
  minimumSampleCount: Int
  consecutiveBreachesRequired: Int
  consecutiveHealthyRequired: Int
  noDataBehavior: String
  severity: String!
  renotifyIntervalMinutes: Int
  destinationIds: [String!]
  metricName: String
  metricAggregation: String
}

"""
  One structured where-clause filter (plan 164). `op` accepts the editor
  tokens: `=`, `!=`, `>`, `<`, `>=`, `<=`, `CONTAINS`, `NOT CONTAINS`.
"""
input AttributeFilterInput {
  key: String!
  op: String!
  value: String!
}

input TestConfigurationFilterInput {
  key: String!
  value: String!
}

type AgentSessionOut {
  rootSpanId: String
  steps: [AgentStepOut!]!
  totalInputTokens: String!
  totalOutputTokens: String!
  errorCount: Int!
  truncated: Boolean!
}

type AgentStepOut {
  spanId: String!
  traceId: String!
  kind: String!
  name: String!
  startNanos: String!
  durationNs: String!
  isError: Boolean!
  genAiOperation: String
  inputTokens: String
  outputTokens: String
}

type AlertCheck {
  ruleId: String!
  groupKey: String!
  checkedAtNanos: String!
  value: Float
  sampleCount: Int!
  "`breach|healthy|no_data|error`."
  status: String!
  error: String
}

type AlertDestination {
  id: String!
  name: String!
  "`webhook|slack_webhook`."
  kind: String!
  """
    Destination config JSON (`{"url": ...}`); V1 stores it plaintext
    (single-operator local-first scope, recorded in plan 167).
  """
  config: String!
  createdAtNanos: String!
  updatedAtNanos: String!
}

type AlertIncident {
  id: String!
  ruleId: String!
  groupKey: String!
  "`open|resolved`."
  status: String!
  "`warning|critical`."
  severity: String!
  firstTriggeredAtNanos: String!
  lastTriggeredAtNanos: String!
  resolvedAtNanos: String
  lastValue: Float
  lastNotifiedAtNanos: String
  "The owning rule, if it still exists."
  rule: AlertRule
  bundle: BundleOut
}

type AlertPreviewGroup {
  groupKey: String!
  points: [AlertPreviewPoint!]!
  samplesSufficient: Boolean!
}

type AlertPreviewPoint {
  tsNanos: String!
  value: Float
  sampleCount: Int!
  wouldFire: Boolean!
}

type AlertRule {
  id: String!
  name: String!
  enabled: Boolean!
  "`error_rate|p95_latency|p99_latency|throughput|log_count|metric`."
  signalType: String!
  "JSON array of scoped service names; `[]` means all services."
  services: String!
  "JSON array of excluded service names."
  excludeServices: String!
  "JSON array of attribute filters (`{key, op, value}` — plan 164 shape)."
  attributeFilters: String!
  "Optional group-by dimension (`service`)."
  groupBy: String
  "`gt|gte|lt|lte|between|not_between`."
  comparator: String!
  threshold: Float!
  thresholdUpper: Float
  windowMinutes: Int!
  minimumSampleCount: Int!
  consecutiveBreachesRequired: Int!
  consecutiveHealthyRequired: Int!
  "`skip|zero`."
  noDataBehavior: String!
  "`warning|critical`."
  severity: String!
  renotifyIntervalMinutes: Int!
  "JSON array of destination ids."
  destinationIds: String!
  metricName: String
  metricAggregation: String
  createdAtNanos: String!
  updatedAtNanos: String!
}

type AlertRulePreview {
  windowMinutes: Int!
  groups: [AlertPreviewGroup!]!
}

type AlertRuleState {
  ruleId: String!
  groupKey: String!
  consecutiveBreaches: Int!
  consecutiveHealthy: Int!
  incidentOpen: Boolean!
  lastNotifiedAtNanos: String
  "`breach|healthy|no_data|error`."
  lastStatus: String
  lastValue: Float
  lastSampleCount: Int!
  lastEvaluatedAtNanos: String
  lastError: String
}

type AttributeCompareRow {
  key: String!
  value: String!
  selectedCount: String!
  selectedTotal: String!
  baselineCount: String!
  baselineTotal: String!
  score: Float!
}

type BackgroundCycle {
  name: String!
  count: Int!
  errorCount: Int!
  p50Ms: Float
  p95Ms: Float
  lastNanos: String!
  lastTraceId: String!
}

type BundleOut {
  "The bundle as canonical JSON."
  json: String!
  "The agent-facing Markdown projection."
  markdown: String!
  canonicalHash: String!
}

type ChangedSpan {
  before: DiffSpan!
  after: DiffSpan!
  durationDeltaNs: String!
  durationDeltaPct: Float!
  statusChanged: Boolean!
}

type Conversation {
  conversationId: String!
  agentName: String
  providerName: String
  firstNanos: String!
  lastNanos: String!
  spanCount: Int!
  inputTokens: Float
  outputTokens: Float
}

type CriticalHop {
  spanId: String!
  selfTimeNs: String!
  gatedByChild: String
  clockSuspect: Boolean!
}

type CriticalPath {
  hops: [CriticalHop!]!
  totalGatedNs: String!
  unattached: [String!]!
}

type Dashboard {
  id: String!
  name: String!
  """
    Widget layout as a JSON string:
    [{metric, agg, chart, title, quantile?}].
  """
  layout: String!
  updatedAtNanos: String!
}

type DiffSpan {
  spanId: String!
  service: String!
  name: String!
  kind: String!
  statusCode: String!
  durationNs: String!
  depth: Int!
  matchKey: String!
}

type DurationStats {
  "Median representative-span duration, milliseconds."
  p50Ms: Float
  "95th-percentile representative-span duration, milliseconds."
  p95Ms: Float
}

type ErrorEvent {
  tsNanos: String!
  service: String!
  fingerprint: String!
  errorType: String!
  message: String!
  stacktrace: String
  source: String!
  traceId: String!
  spanId: String!
  attributes: String!
}

type EvidenceGap {
  kind: String!
  subject: String!
  detail: String!
}

type Facet {
  "Facet dimension name; doubles as the where-clause key."
  dimension: String!
  values: [FieldValueCount!]!
}

type FieldKey {
  key: String!
  namespace: String!
  source: String!
  rowCount: String!
  nonNullCount: String!
  coverage: Float!
  isIdentifier: Boolean!
}

type FieldStats {
  key: String!
  namespace: String!
  source: String!
  rowCount: String!
  nonNullCount: String!
  distinctCount: String!
  coverage: Float!
  capped: Boolean!
  isIdentifier: Boolean!
  topValues: [FieldValueCount!]!
}

type FieldValueCount {
  value: String!
  count: String!
}

type GroupingExplanation {
  algorithmVersion: String!
  errorType: String!
  messageTemplate: String!
  anchorFrame: String!
  operation: String
  inputsPresent: [String!]!
}

type Investigation {
  id: String!
  name: String!
  """
    Opaque V1 investigation state JSON:
    `{version, window, pins, notes}`.
  """
  state: String!
  createdAtNanos: String!
  updatedAtNanos: String!
}

type Invocation {
  invocationId: String!
  command: String
  startedAtNanos: String!
  """
    Wrapper-registered end, else the observed end of the latest completed
    root `cli.command` span (external invocations).
  """
  endedAtNanos: String
  exitCode: Int
  "cli (wrapper-registered) | external (auto-registered from telemetry)."
  registration: String!
  "one_shot | interactive | daemon | capsule, when registered."
  appMode: String
  """
    Bounded result taxonomy (success | failure | error | timeout | skip |
    cancellation): wrapper-registered, else observed from the root
    `cli.command` span's outcome attribute.
  """
  outcome: String
  """
    Derived lifecycle: running | finished | failed | stale. `failed` is a
    finished invocation with a non-zero exit code; `stale` is an unfinished
    invocation with no signal newer than five minutes.
  """
  status: String!
  "Error events derived inside this run's traces."
  errorCount: Int!
  "Distinct traces this run produced."
  traceCount: Int!
  "Interactive sessions observed inside this invocation."
  sessionCount: Int!
  """
    Per-occurrence error events inside this run's traces, nanosecond
    timestamps intact — journey attribution needs each occurrence at its
    exact time, not the group's ms-truncated last-seen.
  """
  errorEvents: [InvocationErrorEvent!]!
  "Grouped issues whose events fell inside this run's traces."
  issues: [Issue!]!
}

"One error occurrence surfaced on the invocation hub (journey beats)."
type InvocationErrorEvent {
  tsNanos: String!
  title: String!
  fingerprint: String!
  traceId: String
}

type InvocationMetricRow {
  "Canonical native-family identity persisted at ingest."
  name: String!
  pointCount: String!
  lastValue: Float!
  lastTsNanos: String!
}

type Issue {
  fingerprint: String!
  title: String!
  errorType: String!
  culprit: String
  service: String!
  status: String!
  firstSeenNanos: String!
  lastSeenNanos: String!
  eventCount: Int!
  lastTraceId: String
  "Bounded top-tag-values cache as JSON: `{key: {value: count}}`."
  tags: String!
  groupingExplanation: GroupingExplanation!
  "The last-24h occurrence sparkline (hourly buckets), oldest first."
  trend: [TrendPoint!]!
  "The most recent stored occurrence."
  latestEvent: ErrorEvent
  """
    Recent occurrences of this issue, newest first, optionally
    range-bounded (`fromNanos`/`toNanos`).
  """
  events(limit: Int, fromNanos: String, toNanos: String): [ErrorEvent!]!
}

type IssueList {
  items: [Issue!]!
  "Matching issues before paging — exact up to the 1000-row scan window."
  total: Int!
}

type Job {
  jobId: String!
  jobType: String
  producedNanos: String
  attempts: [JobAttempt!]!
  lastTraceId: String!
}

type JobAttempt {
  startNanos: String!
  durationMs: Float!
  outcome: String
  hasError: Boolean!
  traceId: String!
}

type LogPattern {
  template: String!
  count: String!
  sampleLogId: String
  firstNanos: String
  lastNanos: String
  "JSON object of severity → count for mix bars."
  severityMixJson: String!
}

type LogRecord {
  tsNanos: String!
  eventName: String!
  observedTsNanos: String!
  service: String!
  severityNum: Int!
  severityText: String!
  body: String!
  traceId: String!
  spanId: String!
  invocationId: String
  scopeName: String!
  attributes: String!
  resource: String!
}

type MetricCatalogRow {
  "Canonical native-table display name (metric-summary contract)."
  name: String!
  "gauge | sum | histogram — bounds legal aggregations client-side."
  kind: String!
  unit: String
  "Emitting services inside the window, deduplicated and sorted."
  services: [String!]!
  lastDatapointNanos: String!
  "Finite exported samples in the window; one count per histogram export."
  pointCount: String!
}

type MetricExemplar {
  tsNanos: String!
  service: String!
  name: String!
  value: Float!
  traceId: String!
  spanId: String!
  invocationId: String
  attributes: String!
}

type MetricQueryOut {
  kind: String!
  "The step actually used after contract rounding (≤120 buckets)."
  effectiveStepSeconds: Int!
  series: [Series!]!
}

type Mutation {
  """
    Set an issue's workflow status (open | resolved); returns the updated
    issue (spec §8: `Issue!`).
  """
  issueSetStatus(fingerprint: String!, status: String!): Issue!
  "Register an invocation (the CLI wrapper calls this before launching)."
  invocationStart(invocationId: String!, command: String, appMode: String, startedAtNanos: String!): Boolean!
  """
    Create or update a user dashboard; returns the saved dashboard
    (spec §8: `Dashboard!`).
  """
  dashboardSave(name: String!, layout: String!, id: String): Dashboard!
  "Delete a user dashboard."
  dashboardDelete(id: String!): Boolean!
  "Create or update an investigation/case state."
  investigationSave(name: String!, state: String!, id: String): Investigation!
  "Delete an investigation/case."
  investigationDelete(id: String!): Boolean!
  "Create or update a named saved page state."
  savedViewSave(name: String!, page: String!, state: String!, id: String): SavedView!
  "Delete a named saved page state."
  savedViewDelete(id: String!): Boolean!
  "Close an invocation with the wrapped command's exit code and outcome."
  invocationFinish(invocationId: String!, endedAtNanos: String!, exitCode: Int!, outcome: String): Boolean!
  """
    Create or update an alert rule (plan 167); optional knobs default per
    the plan contract.
  """
  alertRuleSave(input: AlertRuleInput!): AlertRule!
  "Delete an alert rule."
  alertRuleDelete(id: String!): Boolean!
  "Enable/disable an alert rule without touching its definition."
  alertRuleSetEnabled(id: String!, enabled: Boolean!): AlertRule!
  """
    Create or update a notification destination (webhook | slack_webhook;
    email is deferred in V1). Config is JSON with an http(s) `url`.
  """
  alertDestinationSave(name: String!, kind: String!, config: String!, id: String): AlertDestination!
  "Delete a notification destination."
  alertDestinationDelete(id: String!): Boolean!
}

type ObservedInvocation {
  invocationId: String!
  service: String!
  "Latest `cli.command.name` seen on this invocation's root spans."
  lastCommand: String
  "`app.mode` seen on this invocation's root spans."
  appMode: String
  firstNanos: String!
  lastNanos: String!
  spanCount: Int!
  logCount: Int!
}

type Overview {
  spanCount: String!
  traceCount: String!
  logCount: String!
  metricPointCount: String!
  errorCount: String!
  errorRate: Float!
  activeServices: Int!
}

type Point {
  tsNanos: String!
  value: Float!
}

type Query {
  health: String!
  version: String!
  otlpGrpcPort: Int!
  otlpHttpPort: Int!
  """
    Whole-system counters for an inclusive time window. Counts are strings
    so large telemetry volumes never saturate GraphQL Int.
  """
  overview(fromNanos: String!, toNanos: String!): Overview!
  "Per-signal count series for overview trend charts."
  signalCountSeries(kind: SignalKind!, service: String, fromNanos: String!, toNanos: String!, stepSeconds: Int): [Point!]!
  "Service summary rows for the services index."
  serviceList(fromNanos: String!, toNanos: String!): [ServiceSummary!]!
  "Per-version service release windows in the selected time range."
  releases(service: String!, fromNanos: String!, toNanos: String!): [ReleaseWindow!]!
  "Resource-identity catalog rows for services in the selected window."
  serviceCatalog(fromNanos: String!, toNanos: String!): [ServiceCatalogRow!]!
  "Trace-path service graph over a bounded set of traces in the window."
  serviceMap(fromNanos: String!, toNanos: String!, maxTraces: Int): ServiceMap!
  "Trace-derived RED analytics; works even when a service emits no metrics."
  serviceRed(service: String, fromNanos: String!, toNanos: String!, stepSeconds: Int): SpanRed!
  """
    Grouped errors: filtered, sorted, paged (spec §8 `issues`). The
    `query` argument substring-matches title, error type, and fingerprint;
    `fromNanos`/`toNanos` window on last-seen; `tagKey`+`tagValue` filter
    on the cached tags.
  """
  issues(service: String, status: String, query: String, fromNanos: String, toNanos: String, tagKey: String, tagValue: String, sort: IssueSort, limit: Int, offset: Int): IssueList!
  issue(fingerprint: String!): Issue
  """
    Variant-scoped test explorer. Attempt rollups preserve fail-then-pass as
    flaky-pass; every row references its latest native test span.
  """
  testCases(query: String, suite: String, service: String, serviceVersion: String, status: TestRollup, flakyState: TestFlakyState, configuration: TestConfigurationFilterInput, fromNanos: String, toNanos: String, sort: TestExplorerSort, limit: Int, offset: Int): TestExplorerPage!
  "One test case with bounded variants and newest-first attempt history."
  testCase(caseKey: String!, variantLimit: Int, resultLimit: Int): TestCaseDetail
  """
    Occurrence counts per bucket for one issue's sparkline, oldest
    first. Defaults: the last 24 hours in one-hour buckets.
  """
  issueTrend(fingerprint: String!, hours: Int, stepSeconds: Int): [TrendPoint!]!
  "Every span of one trace, start-time ascending (cross-service)."
  trace(traceId: String!): Trace
  """
    Parsed span events across one trace, time ascending. `namePrefix`
    filters by event name (for example "rpc.message" or "exception").
  """
  traceEvents(traceId: String!, namePrefix: String, limit: Int): TraceEventsOut!
  "Summaries for traces referenced by this trace's span links."
  linkedTraces(traceId: String!): [TraceSummary!]!
  "Critical-path hops that gate one trace's latency."
  traceCriticalPath(traceId: String!): CriticalPath!
  "Structural diff between two traces' span trees."
  traceCompare(traceIdA: String!, traceIdB: String!): TraceDiff!
  "Logs correlated to one trace, time ascending."
  logsByTrace(traceId: String!): [LogRecord!]!
  """
    Traces produced by one run, summarized (root span + aggregates),
    newest first. Open one via `trace(traceId:)`.
  """
  tracesByInvocation(invocationId: String!, limit: Int): [TraceSummary!]!
  "Logs produced by one run."
  logsByInvocation(invocationId: String!, limit: Int): [LogRecord!]!
  "Agent-session projection for one run when `gen_ai` producer spans exist."
  agentSession(invocationId: String!): AgentSessionOut
  "Deterministic story timeline for exactly one trace or run anchor."
  story(traceId: String, invocationId: String): [StoryBeat!]!
  "Missing-evidence detector for exactly one trace or run anchor."
  evidenceGaps(traceId: String, invocationId: String): [EvidenceGap!]!
  "Span-attribute overrepresentation in selected vs baseline windows."
  attributeCompare(selectedFromNanos: String!, selectedToNanos: String!, baselineFromNanos: String!, baselineToNanos: String!, service: String, errorOnly: Boolean, keys: [String!], topN: Int): [AttributeCompareRow!]!
  "Scalar span/resource attribute keys in a bounded time window."
  fieldKeys(fromNanos: String!, toNanos: String!): [FieldKey!]!
  "Bounded coverage/cardinality/top-values stats for one field key."
  fieldStats(key: String!, fromNanos: String!, toNanos: String!, service: String): FieldStats!
  """
    Unified log browse (spec §8 `logs`): every filter optional, newest
    first. `query` substring-matches the body; trace/run scoping
    composes with the other filters.
  """
  logs(traceId: String, invocationId: String, service: String, fromNanos: String, toNanos: String, severityMin: Int, severityMax: Int, query: String, attributeFilters: [AttributeFilterInput!], limit: Int): [LogRecord!]!
  "Logs surrounding one anchor timestamp, ascending."
  logsAround(anchorNanos: String!, windowSeconds: Int, service: String, traceId: String, limit: Int): [LogRecord!]!
  """
    Raw read-only SQL against the telemetry engine (`GreptimeDB`) — the
    engine's full query power over logs, traces, and metrics tables.
    SELECT-shaped single statements only.
  """
  sql(query: String!): SqlResultOut!
  """
    Log counts per time bucket under the same filters as `logs` — the
    Discover-style histogram above the log table.
  """
  logCountSeries(fromNanos: String!, toNanos: String!, service: String, severityMin: Int, severityMax: Int, query: String, attributeFilters: [AttributeFilterInput!], stepSeconds: Int): [Point!]!
  """
    Bounded log facet dimensions with per-value counts under the same
    filters as `logs` (plan 164 facet sidebar).
  """
  logFacets(fromNanos: String, toNanos: String, service: String, severityMin: Int, severityMax: Int, query: String, attributeFilters: [AttributeFilterInput!]): [Facet!]!
  "Drain-style log body patterns over a bounded sample (plan 165)."
  logPatterns(fromNanos: String, toNanos: String, service: String, severityMin: Int, severityMax: Int, query: String, attributeFilters: [AttributeFilterInput!], limit: Int): [LogPattern!]!
  "One CLI invocation by id (wrapper-registered or auto-registered external)."
  invocation(invocationId: String!): Invocation
  """
    Interactive sessions observed inside one invocation, oldest first
    (from `session.start`/`session.end` log events).
  """
  sessions(invocationId: String!): [Session!]!
  "Screen visits (entered/exited event pairs) for an invocation or session."
  screenVisits(invocationId: String, sessionId: String): [ScreenVisit!]!
  "Bounded user-action root spans (`ui.action`) for one invocation."
  uiActions(invocationId: String!, limit: Int): [UiAction!]!
  "Periodic daemon work grouped by cycle name (`background.cycle` spans)."
  backgroundCycles(invocationId: String, fromNanos: String!, toNanos: String!): [BackgroundCycle!]!
  "Detached jobs (producer/consumer span pairs sharing `job.id`)."
  jobs(invocationId: String, fromNanos: String!, toNanos: String!): [Job!]!
  "Agent conversations (`gen_ai.conversation.id` spans) in one invocation."
  conversations(invocationId: String!): [Conversation!]!
  "One saved dashboard by id."
  dashboard(id: String!): Dashboard
  "One saved investigation by id."
  investigation(id: String!): Investigation
  """
    The predefined service overview (spec §8): CPU, memory, request rate,
    latency percentiles, error rate from well-known metric names, with
    graceful absence.
  """
  serviceOverview(service: String!, fromNanos: String!, toNanos: String!, stepSeconds: Int): ServiceOverview!
  """
    Invocation ids observed in telemetry (any tool exporting `cli.invocation.id`
    — e.g. jackin'), newest activity first. Independent of wrapper
    registration: this is how external runs appear in the UI.
  """
  observedInvocations(limit: Int): [ObservedInvocation!]!
  """
    Bounded invocation facet dimensions (service, app.mode,
    cli.command.name, outcome) with per-value DISTINCT-invocation counts
    for the invocations facet sidebar (plan 164). Bounds default to the
    retained recent window.
  """
  invocationFacets(fromNanos: String, toNanos: String): [Facet!]!
  "Recent traces (root span + aggregates), newest first."
  recentTraces(limit: Int): [TraceSummary!]!
  "Filtered trace browse; optional filters, root span except errorOnly."
  traces(service: String, fromNanos: String, toNanos: String, minDurationMs: Float, maxDurationMs: Float, errorOnly: Boolean, query: String, limit: Int, offset: Int, sort: TraceSort): [TraceSummary!]!
  """
    Filtered, sorted, paged trace browse with total count for redesigned
    trace list clients.
  """
  tracesPage(service: String, fromNanos: String, toNanos: String, minDurationMs: Float, maxDurationMs: Float, errorOnly: Boolean, query: String, attributeFilters: [AttributeFilterInput!], limit: Int, offset: Int, sort: TraceSort): TraceList!
  """
    Duration p50/p95 of the current trace filter set (plan 164 preset
    chips); duration bounds are not accepted so presets never feed back
    into themselves.
  """
  traceDurationStats(service: String, fromNanos: String, toNanos: String, errorOnly: Boolean, query: String, attributeFilters: [AttributeFilterInput!]): DurationStats!
  """
    Bounded facet dimensions with per-value distinct-trace counts for
    the facet sidebar (plan 164).
  """
  traceFacets(service: String, fromNanos: String, toNanos: String, errorOnly: Boolean, query: String, attributeFilters: [AttributeFilterInput!]): [Facet!]!
  "Bounded redacted evidence bundle. Exactly one of fingerprint, invocationId, traceId, alertIncidentId."
  bundle(fingerprint: String, invocationId: String, traceId: String, alertIncidentId: String, maxTokens: Int): BundleOut
  "Invocation-scoped metric family summaries (plan 105)."
  invocationMetrics(invocationId: String!, fromNanos: String, toNanos: String, limit: Int): [InvocationMetricRow!]!
  "Metric catalog; `q` substring, `kind` one kind."
  metricCatalog(fromNanos: String!, toNanos: String!, q: String, kind: String, limit: Int): [MetricCatalogRow!]!
  """
    The single shared metric read path (plan 168): typed kind + aggregation
    legality (gauge→avg|min|max|last, sum→sum|rate|increase, histogram→p50|p95|p99|avg),
    optional service filter and group-by, contract step rounding (≤120
    buckets, minimum 1s). Explorer, dashboards, and alerts all consume this.
  """
  metricQuery(name: String!, kind: String!, agg: String!, fromNanos: String!, toNanos: String!, service: String, attributeFilters: [AttributeFilterInput!], groupBy: String, stepSeconds: Int): MetricQueryOut!
  """
    Distinct metric names seen by the store (drives the dashboard
    builder), optionally prefix-filtered.
  """
  metricNames(prefix: String): [String!]!
  "Groupable label/tag keys for one metric."
  metricLabels(name: String!): [String!]!
  "Distinct values for one metric label inside a time window."
  metricLabelValues(name: String!, label: String!, fromNanos: String!, toNanos: String!): [String!]!
  "Distinct service names (drives the service-overview selector)."
  services: [String!]!
  "Runtime metric lanes, scoped to exactly one service or run."
  runtimeSnapshot(service: String, invocationId: String, fromNanos: String!, toNanos: String!, stepSeconds: Int!): [RuntimeMetric!]!
  """
    Aggregated series for a point metric (gauge/sum); agg one of
    avg|min|max|sum|rate. With `groupBy` (an attribute key) one series
    per value; without it a single series with a null `groupValue`
    (spec §8 `metricSeries`). `invocationId` scopes to points whose resource
    carried `cli.invocation.id` (run-anchored cross-analytics).
  """
  metricSeries(name: String!, fromNanos: String!, toNanos: String!, service: String, invocationId: String, groupBy: String, stepSeconds: Int, agg: String): [Series!]!
  "Approximate quantile series from a histogram metric (q in 0..=1)."
  histogramQuantile(name: String!, fromNanos: String!, toNanos: String!, q: Float!, service: String, stepSeconds: Int): [Point!]!
  "Trace-linked exemplars for one metric, newest first."
  metricExemplars(name: String!, fromNanos: String!, toNanos: String!, service: String, limit: Int): [MetricExemplar!]!
  "Saved user dashboards, most recently updated first."
  dashboards: [Dashboard!]!
  "Saved investigations/cases, most recently updated first."
  investigations: [Investigation!]!
  "Named saved page states, most recently updated first."
  savedViews(page: String): [SavedView!]!
  invocations(limit: Int): [Invocation!]!
  "Alert rules, most recently updated first (plan 167)."
  alertRules: [AlertRule!]!
  "Evaluate a draft rule over the recent window without persisting (plan 171)."
  alertRulePreview(input: AlertRuleInput!, windowMinutes: Int): AlertRulePreview!
  alertRule(id: String!): AlertRule
  "Per-group rolling evaluation state for one rule."
  alertRuleStates(ruleId: String!): [AlertRuleState!]!
  "Incidents newest-first; `status` filters open|resolved."
  alertIncidents(status: String, ruleId: String, limit: Int): [AlertIncident!]!
  alertIncident(id: String!): AlertIncident
  "Notification destinations, most recently updated first."
  alertDestinations: [AlertDestination!]!
  """
    Recent evaluation audit rows for one rule, newest first (bounded
    retention: last 500 per rule).
  """
  alertChecks(ruleId: String!, limit: Int): [AlertCheck!]!
}

