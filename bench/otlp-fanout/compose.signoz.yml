# Current SigNoz deployment overlay.
#
# Run ./setup-vendor.sh first. It uses the supported SigNoz Foundry workflow
# and writes vendor/signoz-pours/deployment/compose.yaml. Override the output
# with SIGNOZ_POURS_DIR for a dated evidence run.
include:
  - path: ${SIGNOZ_POURS_DIR:-vendor/signoz-pours}/deployment/compose.yaml
  - path: compose.signoz.override.yml
